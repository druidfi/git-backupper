name: Backup

on:
  schedule:
    - cron:  '0 0 * * *' # UTC == 2 AM EET
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup
  cancel-in-progress: false

jobs:

  backup:

    # Repositories created from this template stay inactive until configured
    if: vars.BACKUP_ENABLED == 'true'

    runs-on: ubuntu-latest
    timeout-minutes: 120

    # Backup and sync run in the same job so that backup data never leaves
    # the runner via GitHub caches or artifacts (this repository is public).
    steps:

      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Backup repositories from GitHub
        run: ${GITHUB_WORKSPACE}/backup.sh
        env:
          # PAT needs these scopes: read:org, repo
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          GH_OWNER: ${{ vars.GH_OWNER || github.repository_owner }}
          GH_LIST_LIMIT: ${{ vars.GH_LIST_LIMIT || 1000 }}
          SLACK_HOOK: ${{ secrets.SLACK_HOOK }}

      - name: Sync backups to S3
        run: ${GITHUB_WORKSPACE}/s3.sh
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_REGION: ${{ vars.S3_REGION || 'eu-central-1' }}
          ENDPOINT_URL: ${{ secrets.ENDPOINT_URL }}
          SLACK_HOOK: ${{ secrets.SLACK_HOOK }}

      - name: Notify Slack about failure
        if: failure()
        run: |
          if [ -z "${SLACK_HOOK}" ]; then exit 0; fi
          jq -n --arg text ":warning: Backup workflow failed: ${RUN_URL}" '{text: $text}' \
            | curl -s -o /dev/null -X POST -H 'Content-type: application/json' --data @- "${SLACK_HOOK}"
        env:
          SLACK_HOOK: ${{ secrets.SLACK_HOOK }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

  cleanup:

    runs-on: ubuntu-latest
    needs: [ backup ]
    # Prune runs and caches also when the backup failed
    if: always() && needs.backup.result != 'skipped'

    permissions:
      contents: read
      actions: write

    steps:

      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Delete workflow runs and cache
        run: ${GITHUB_WORKSPACE}/cleanup.sh
        env:
          GH_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
